<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d0d18"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f6ad55"/>
      <stop offset="100%" style="stop-color:#e8903a"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" ry="7" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="32" height="32" rx="7" ry="7" fill="none" stroke="#f6ad55" stroke-width="1" opacity="0.35"/>

  <!-- Synapse node icon: connected dots -->
  <g stroke="url(#textGrad)" stroke-width="1.6" fill="url(#textGrad)">
    <line x1="10" y1="9" x2="22" y2="9"/>
    <line x1="10" y1="9" x2="16" y2="23"/>
    <line x1="22" y1="9" x2="16" y2="23"/>
    <line x1="10" y1="9" x2="22" y2="16"/>
    <line x1="22" y1="16" x2="16" y2="23"/>
    <circle cx="10" cy="9" r="2.4"/>
    <circle cx="22" cy="9" r="2.4"/>
    <circle cx="22" cy="16" r="2.4"/>
    <circle cx="16" cy="23" r="2.4"/>
  </g>
</svg>
