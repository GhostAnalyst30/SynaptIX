name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar synaptix (núcleo)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      # Los tests que requieren viewx/statslibx/polars/plotly se
      # auto-omiten con pytest.importorskip.
      - name: Ejecutar tests (núcleo)
        run: pytest tests/ -v

  integracion:
    # Valida el contrato del payload entre synaptix, statslibx y viewx.
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar synaptix + librerías hermanas
        run: |
          python -m pip install --upgrade pip
          pip install -e .[viz] pytest
          # Desde PyPI; si alguna no está publicada aún, fallback a GitHub.
          pip install viewx statslibx polars pyarrow || \
            pip install "viewx @ git+https://github.com/GhostAnalyst30/ViewX" \
                        "statslibx @ git+https://github.com/GhostAnalyst30/StatsLibX" \
                        polars pyarrow

      - name: Ejecutar tests de integración
        run: pytest tests/test_integration_bridge.py -v
