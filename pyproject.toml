[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synaptix"
version = "0.1.6"
description = "Librería integral de Machine Learning para Python: supervisado, no supervisado, refuerzo, redes neuronales y preprocesamiento."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Emmanuel Ascendra Perez", email = "ascendraemmanuel@gmail.com" },
]
keywords = [
    "machine learning",
    "deep learning",
    "reinforcement learning",
    "artificial intelligence",
    "data science",
    "synaptix",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "scikit-learn>=1.2.0",
    "requests>=2.25.0",
]

[project.urls]
Repositorio = "https://github.com/GhostAnalyst30/SynaptIX"
"Reportar Bugs" = "https://github.com/GhostAnalyst30/SynaptIX/issues"
Documentacion = "https://github.com/GhostAnalyst30/SynaptIX/wiki"

[project.optional-dependencies]
dl = ["tensorflow>=2.12.0"]
nlp = ["nltk>=3.6.0"]
viz = ["seaborn>=0.11.0", "plotly>=5.0.0"]
all = [
    "tensorflow>=2.12.0",
    "nltk>=3.6.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["synaptix*"]
exclude = ["build*", "dist*", "docs-web*", "tests*"]

[tool.setuptools.package-data]
synaptix = ["datasets/*.csv"]
